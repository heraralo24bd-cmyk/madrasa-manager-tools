"tool-tile" data-action="preview:${a}"><span class="special-icon">${icon(a.includes("ক্যালিগ্রাফি")?"spark":"book")}</span>${a}<small>${c}</small></button>`}).join('')+'</div>')}

function browserFooter(){const pages=browserPages();pages.forEach((p,i)=>{p.querySelectorAll('.page-number-note').forEach(n=>n.remove());p.insertAdjacentHTML('beforeend',`<span class="page-number-note" contenteditable="false">পৃষ্ঠা ${i+1} / ${pages.length}</span>`)});const index=Math.max(0,pages.indexOf(browserActive));document.querySelector('.status [data-action="preview:পৃষ্ঠা"]').lastChild.textContent=` পৃষ্ঠা ${index+1}/${pages.length}`;let words=pages.map(p=>{const c=p.cloneNode(true);c.querySelectorAll('.page-number-note,.pl-watermark,.pl-line-number').forEach(n=>n.remove());return c.textContent}).join(' ').trim();document.querySelector('#words').textContent='শব্দ: '+(words?words.split(/\s+/).length:0)}
function browserLoad(record){browserCurrent=record;browserPages().forEach(p=>p.remove());for(const page of record.pages){const p=document.createElement('article');p.className='paper';p.contentEditable='true';p.spellcheck=false;p.setAttribute('aria-label','ডকুমেন্ট পৃষ্ঠা');p.dataset.margin='A4 মার্জিন সীমা (Page Margin)';p.innerHTML=browserClean(page.html)||'<p><br></p>';if(page.style&&!/(url\s*\(|expression|@import)/i.test(page.style))p.setAttribute('style',page.style);document.querySelector('.page-add').before(p)}browserActive=browserPages()[0];browserRange=null;document.querySelector('.doc-title strong').textContent=record.title;browserFooter();document.querySelector('.backstage').classList.add('hidden');document.querySelector('.overlay').classList.add('hidden');browserPersist()}
function browserNew(title='নতুন ডকুমেন্ট',html='<p><br></p>'){browserPersist();const record={id:browserId(),title,pages:[{html,style:''}],updated:new Date().toISOString()};browserLibrary.push(record);browserLoad(record)}
function browserPageAdd(){const p=document.createElement('article');p.className='paper';p.contentEditable='true';p.spellcheck=false;p.setAttribute('aria-label','ডকুমেন্ট পৃষ্ঠা');p.dataset.margin='A4 মার্জিন সীমা (Page Margin)';p.innerHTML='<p><br></p>';if(browserActive)p.setAttribute('style',browserActive.getAttribute('style')||'');document.querySelector('.page-add').before(p);browserActive=p;browserRange=null;browserFooter();p.focus();p.scrollIntoView({block:'start',behavior:'smooth'});browserPersist()}
format=function(command,arg){const target=browserActive||browserPages()[0];target.focus();if(browserRange&&target.contains(browserRange.commonAncestorContainer)){const s=getSelection();s.removeAllRanges();s.addRange(browserRange)}document.execCommand(command,false,arg);const s=getSelection();if(s.rangeCount)browserRange=s.getRangeAt(0).cloneRange();browserFooter();browserPersist()};
document.addEventListener('selectionchange',()=>{const s=getSelection();if(!s.rangeCount)return;const range=s.getRangeAt(0);const n=range.commonAncestorContainer;const el=n.nodeType===1?n:n.parentElement;const paper=el&&el.closest('.paper');if(paper){browserActive=paper;browserRange=range.cloneRange()}});
document.addEventListener('input',e=>{if(e.target.closest('.paper')){browserActive=e.target.closest('.paper');browserFooter();clearTimeout(browserSaveTimer);browserSaveTimer=setTimeout(browserPersist,250)}});
document.addEventListener('focusin',e=>{if(e.target.closest('.paper'))browserActive=e.target.closest('.paper')});
document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='Enter'&&e.target.closest('.paper')){e.preventDefault();browserPageAdd()}});
function browserLibraryPanel(){browserPersist();modal('লোকাল ডকুমেন্ট লাইব্রেরি','<div class="browser-library">'+browserLibrary.map(d=>`<button data-action="browser-open:${d.id}"><strong>${browserEscape(d.title)}</strong><small>${d.pages.length} পৃষ্ঠা</small></button>`).join('')+'</div><button class="primary" data-action="browser-new">নতুন ডকুমেন্ট</button>')}
offlineBackup=function(){toast('এই ডিজাইনে ব্যাকআপ ফাইল তৈরি হয় না')};
offlineOpen=function(){pickLocalFile('.json',async file=>{try{const data=JSON.parse(await file.text());if(data.app!=='MadrasaManager')throw Error();const records=data.version===2?data.documents:[{id:browserId(),title:data.title||'আমদানি করা ডকুমেন্ট',pages:[{html:data.html,style:''}]}];if(!Array.isArray(records)||!records.length||records.some(r=>!Array.isArray(r.pages)||!r.pages.length||r.pages.some(p=>typeof p.html!=='string')))throw Error();for(const r of records){r.id=browserId();r.title=String(r.title||'আমদানি করা ডকুমেন্ট');r.pages=r.pages.map(p=>({html:browserClean(p.html),style:typeof p.style==='string'&&!/(url\s*\(|expression|@import)/i.test(p.style)?p.style:''}));browserLibrary.push(r)}if(Array.isArray(data.questions)){const old=readQuestions();for(const q of data.questions)if(typeof q.name==='string'&&typeof q.text==='string'&&!old.some(v=>v.name===q.name&&v.text===q.text))old.push(q)}browserLoad(records[0]);toast('ব্যাকআপ নতুন কপি হিসেবে আমদানি হয়েছে; আগের কাজ রাখা হয়েছে')}catch{toast('ব্যাকআপ ফাইলটি সঠিক নয় বা পড়া যায়নি')}})};
bankPanel=function(){browserQuestionEdit=-1;modal('লোকাল প্রশ্নব্যাংক','<input id="browser-bank-filter" placeholder="প্রশ্ন খুঁজুন"><input id="question-name" placeholder="প্রশ্নের নাম"><textarea id="question-text" rows="4" placeholder="প্রশ্ন লিখুন"></textarea><input id="question-folder" placeholder="বিষয় বা ফোল্ডার"><button class="primary" data-action="browser-question-save">প্রশ্ন সংরক্ষণ</button><div id="browser-question-list"></div>');browserBankRender()};
function browserBankRender(){const box=document.querySelector('#browser-question-list');if(!box)return;const filter=document.querySelector('#browser-bank-filter').value.toLowerCase();box.innerHTML=readQuestions().map((q,i)=>({...q,index:i})).filter(q=>(q.name+' '+q.text+' '+(q.folder||'')).toLowerCase().includes(filter)).map(q=>`<div class="browser-question"><strong>${browserEscape(q.name)}</strong><small>${browserEscape(q.folder||'সাধারণ')}</small><p>${browserEscape(q.text)}</p><button data-action="question-insert" data-index="${q.index}">কাগজে বসান</button><button data-action="browser-question-edit:${q.index}">সম্পাদনা</button><button data-action="browser-question-delete:${q.index}">মুছুন</button></div>`).join('')||'<p>কোনো প্রশ্ন পাওয়া যায়নি।</p>'}
let browserQuestionEdit=-1;
const browserTemplates={
'বাংলা টেমপ্লেট':()=>'<h2 style="text-align:center">প্রতিষ্ঠানের নাম</h2><p style="text-align:center">পরীক্ষার নাম ও সাল</p><p>শ্রেণি: ______ বিষয়: বাংলা</p><p>সময়: ______ পূর্ণমান: ______</p><hr><p>১। নিচের প্রশ্নগুলোর উত্তর দাও।</p><p>(ক) ____________________</p><p>(খ) ____________________</p><p>২। শূন্যস্থান পূরণ করো।</p><p>(ক) ____________________</p>',
'আরবি টেমপ্লেট':()=>'<div dir="rtl"><h2 style="text-align:center">بسم الله الرحمن الرحيم</h2><p style="text-align:center">اسم المؤسسة</p><p>الصف: ______ المادة: ______</p><p>الوقت: ______ الدرجة الكاملة: ______</p><hr><p>١. أجب عن الأسئلة الآتية</p><p>(أ) ____________________</p><p>(ب) ____________________</p></div>',
'ইংরেজি টেমপ্লেট':()=>'<h2 style="text-align:center">Institution Name</h2><p style="text-align:center">Examination and Year</p><p>Class: ______ Subject: English</p><p>Time: ______ Full Marks: ______</p><hr><p>1. Answer the following questions.</p><p>(a) ____________________</p><p>(b) ____________________</p>',
'টেবিল প্রশ্ন':()=>'<h2 style="text-align:center">মিলকরণ প্রশ্ন</h2><p>বাম পাশের সঙ্গে ডান পাশ মিল করো।</p>'+browserTable(6,2),
'পরীক্ষার রুটিন':()=>'<h2 style="text-align:center">পরীক্ষার রুটিন</h2><p>প্রতিষ্ঠান: ______ শ্রেণি: ______ সাল: ______</p>'+browserTable(8,4,['তারিখ','দিন','বিষয়','সময়']),
'সকল প্রকার নোটিশ':()=>'<h2 style="text-align:center">প্রতিষ্ঠানের নাম</h2><h3 style="text-align:center">নোটিশ</h3><p>তারিখ: ______ স্মারক: ______</p><p>সকলের অবগতির জন্য জানানো যাচ্ছে যে ____________________</p><p>____________________</p><p style="text-align:right">অধ্যক্ষ / প্রধান শিক্ষক</p>'};
function browserTable(rows,cols,headers=[]){return '<table style="width:100%;border-collapse:collapse">'+Array.from({length:rows},(_,r)=>'<tr>'+Array.from({length:cols},(_,c)=>`<td style="border:1px solid #68768a;padding:8px">${r===0&&headers[c]?headers[c]:'&nbsp;'}</td>`).join('')+'</tr>').join('')+'</table><p><br></p>'}
function browserTemplatePanel(){modal('টেমপ্লেট থেকে নতুন ডকুমেন্ট','<div class="cards">'+Object.keys(browserTemplates).map(n=>`<button data-action="browser-template:${n}">${n}</button>`).join('')+'</div><p>এগুলো সম্পাদনাযোগ্য প্রাথমিক কাঠামো। তথ্য ও প্রশ্ন নিজের মতো পূরণ করুন।</p>')}
function browserFindPanel(replace=false){modal(replace?'খুঁজুন ও বদলান':'লেখা খুঁজুন','<input id="browser-find" placeholder="যে লেখা খুঁজবেন">'+(replace?'<input id="browser-replace" placeholder="নতুন লেখা">':'')+'<button class="primary" data-action="browser-find-next">খুঁজুন</button>'+(replace?'<button class="primary" data-action="browser-replace-all">সব বদলান</button>':'')+'<p id="browser-find-result"></p>')}
function browserReplaceAll(find,replace){let count=0;for(const p of browserPages()){const walker=document.createTreeWalker(p,NodeFilter.SHOW_TEXT);let node;while(node=walker.nextNode()){if(node.parentElement.closest('.page-number-note'))continue;const split=node.textContent.split(find);count+=split.length-1;if(split.length>1)node.textContent=split.join(replace)}}browserFooter();browserPersist();return count}
document.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;const a=btn.dataset.action||'',label=btn.textContent.trim();let done=true;
if(a==='browser-new'){browserNew();toast('নতুন ডকুমেন্ট তৈরি হয়েছে')}
else if(a==='browser-library')browserLibraryPanel();
else if(a.startsWith('browser-open:')){browserPersist();browserLoad(browserLibrary.find(d=>d.id===a.slice(13)))}
else if(a==='add-page'||a==='insert-break')browserPageAdd();
else if(a.startsWith('browser-template:')){const n=a.slice(17);browserNew(n,browserTemplates[n]());toast('টেমপ্লেটের নতুন কপি তৈরি হয়েছে')}
else if(a.startsWith('preview:')&&(browserTemplates[a.slice(8)]||/টেমপ্লেট|প্রশ্নপত্র|রুটিন|Notice|নোটিশ|Blank Document/.test(a)))browserTemplatePanel();
else if(a==='preview:অ্যাপ ইনস্টল')modal('ব্রাউজার সংস্করণ','<p>MadrasaManager.html খুলে অফলাইনে ব্যবহার করুন। এটি ইনস্টলার নয়। গুরুত্বপূর্ণ কাজ শেষে JSON ব্যাকআপ রাখুন।</p>');
else if(a.includes('প্রশ্নব্যাংক')&&a.startsWith('preview:'))bankPanel();
else if(a==='preview:⌕ Find')browserFindPanel();
else if(a==='preview:Replace')browserFindPanel(true);
else if(a==='preview:↖ Select')format('selectAll');
else if(a==='browser-find-next'){const value=document.querySelector('#browser-find').value;let matched=false;if(value){for(const p of browserPages()){const w=document.createTreeWalker(p,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){const index=n.textContent.indexOf(value);if(index>=0&&!n.parentElement.closest('.page-number-note')){browserActive=p;browserRange=document.createRange();browserRange.setStart(n,index);browserRange.setEnd(n,index+value.length);matched=true;break}}if(matched)break}}document.querySelector('#browser-find-result').textContent=matched?'মিল পাওয়া গেছে। সংলাপ বন্ধ করলে নির্বাচিত অংশ দেখা যাবে।':'মিল পাওয়া যায়নি';if(matched){const s=getSelection();s.removeAllRanges();s.addRange(browserRange)}}
else if(a==='browser-replace-all'){const value=document.querySelector('#browser-find').value;if(value)document.querySelector('#browser-find-result').textContent=browserReplaceAll(value,document.querySelector('#browser-replace').value)+'টি মিল বদলানো হয়েছে'}
else if(a==='browser-question-save'){const name=document.querySelector('#question-name').value.trim(),text=document.querySelector('#question-text').value.trim();if(!name||!text){toast('নাম ও প্রশ্ন লিখুন')}else{const list=readQuestions(),q={name,text,folder:document.querySelector('#question-folder').value.trim()};if(browserQuestionEdit>=0)list[browserQuestionEdit]=q;else list.push(q);browserQuestionEdit=-1;bankPanel();toast('প্রশ্ন এই সেশনে যোগ হয়েছে — কোনো ডাটাবেস নেই')}}
else if(a.startsWith('browser-question-edit:')){browserQuestionEdit=+a.slice(22);const q=readQuestions()[browserQuestionEdit];document.querySelector('#question-name').value=q.name;document.querySelector('#question-text').value=q.text;document.querySelector('#question-folder').value=q.folder||''}
else if(a.startsWith('browser-question-delete:')){const i=+a.slice(24);modal('প্রশ্ন মুছবেন কি','<p>ভুল এড়াতে আগে ব্যাকআপ রাখুন।</p><button class="primary" data-action="browser-question-confirm:'+i+'">এই প্রশ্ন মুছুন</button>')}
else if(a.startsWith('browser-question-confirm:')){const list=readQuestions();list.splice(+a.slice(25),1);bankPanel()}
else if(a==='table'){const r=Math.max(1,Math.min(30,+document.querySelector('[aria-label="সারি"]').value||4)),c=Math.max(1,Math.min(10,+document.querySelector('[aria-label="কলাম"]').value||3));format('insertHTML',browserTable(r,c))}
else if(a==='preview:২ কলাম (মিলকরণ)'||/^preview:[৩৪৫] কলাম/.test(a)){const n='২৩৪৫'.indexOf(a.slice(8,9))+2;format('insertHTML',browserTable(5,n))}
else if(a==='export'){browserPersist();toast('এই ডিজাইনে HTML ফাইল ডাউনলোড হয় না')}
else if(a==='print'||a==='download'){document.querySelector('.overlay').classList.add('hidden');browserPersist();document.querySelector('#browser-print-settings').textContent='@media print{@page{size:A4 '+((browserActive.style.width==='1123px')?'landscape':'portrait')+';margin:0}.paper{break-after:page;box-shadow:none}.paper:last-of-type{break-after:auto}}';window.print()}
else if(a==='save'){browserPersist();mmSavedToast()}
else if(a==='portrait'||a==='landscape'){browserActive.style.width=a==='portrait'?'794px':'1123px';browserActive.style.minHeight=a==='portrait'?'1123px':'794px';browserPersist()}
else if(a==='set-margin'){const n=Math.max(5,Math.min(50,+document.querySelector('#page-margin').value||14));browserActive.style.padding=n+'mm';document.querySelector('.overlay').classList.add('hidden');browserPersist()}
else if(a.startsWith('set-border:')){browserActive.style.border='3px '+a.slice(11)+' #0b1f3a';document.querySelector('.overlay').classList.add('hidden');browserPersist()}
else if(a.startsWith('columns:')){browserActive.style.columnCount=+a.slice(8);document.querySelector('.overlay').classList.add('hidden');browserPersist()}
else if(btn.id==='rename'){const name=document.querySelector('#new-title').value.trim();if(name)document.querySelector('.doc-title strong').textContent=name;document.querySelector('.overlay').classList.add('hidden');browserPersist()}
else if(a==='preview:সাহায্য ও ডকুমেন্ট পরিসংখ্যান')modal('ব্রাউজার সংস্করণ ব্যবহার','<p>লেখা, ফন্ট, রং, টেবিল, ছবি, নতুন পৃষ্ঠা, লোকাল প্রশ্নব্যাংক ও টেমপ্লেট ব্যবহার করা যাবে। File → Open থেকে আগের ডকুমেন্ট খুলুন। নাম বদলাতে উপরের নাম ডাবল ক্লিক করুন।</p><p>Ctrl+S সেভ করে। Ctrl+Enter নতুন পৃষ্ঠা দেয়। প্রিন্টের Save as PDF দিয়ে PDF রাখুন। JSON ব্যাকআপে সব ডকুমেন্ট ও প্রশ্ন থাকে; অন্য ডিভাইসে আমদানি করুন। দুই ডিভাইস নিজে থেকে সমন্বয় হয় না।</p><p>ব্রাউজারের ডেটা মুছে গেলে লোকাল সেভ হারাতে পারে; নিয়মিত ব্যাকআপ রাখুন। ফাইলের মধ্যে SolaimanLipi, Kalpurush ও Hind Siliguri আছে। অন্য ফন্টের জন্য লোকাল ফন্ট লাগবে।</p><p>OCR, পূর্ণ কুরআন-হাদীস ব্যাংক ও কয়েকটি বিশেষ রিবন টুল এখনো নমুনা। পৃষ্ঠার লেখা বেশি হলে নতুন পৃষ্ঠা যোগ করুন। নিচের স্লাইডার ও মাইনাস–প্লাস দিয়ে পৃষ্ঠার জুম বদলান। ফিট দিয়ে পুরো পৃষ্ঠা দেখুন; শতাংশ বাটনে ক্লিক করলে ১০০% হবে।</p>');
else if(a==='preview:¶→'){browserActive.dir='ltr';browserActive.style.direction='ltr';browserPersist()}
else if(a==='preview:←¶'){browserActive.dir='rtl';browserActive.style.direction='rtl';browserPersist()}
else done=false;
if(done){e.preventDefault();e.stopImmediatePropagation()}},true);
document.addEventListener('input',e=>{if(e.target.id==='browser-bank-filter')browserBankRender()});

const target=browserActive||browserPages()[0];let handled=true;

else if(e.target.getAttribute('aria-label')==='লাইন স্পেসিং')target.style.lineHeight=parseFloat(e.target.value);

function vfDataURL(bytes){let s='';for(let i=0;i<bytes.length;i+=16384)s+=String.fromCharCode(...bytes.subarray(i,i+16384));return 'data:font/ttf;base64,'+btoa(s)}
async function vfInstall(record){if(record.local===true){if(typeof record.name!=='string'||!record.name||record.name.length>100||/["\\]/.test(record.name))throw Error('Invalid font');const face=new FontFace(record.name,'local("'+record.name+'")');await face.load();document.fonts.add(face);vfFonts.set(record.name,record);vfRefresh();return}if(typeof record.name!=='string'||!record.name.trim()||record.name.length>100||typeof record.data!=='string'||!/^data:font\/(ttf|otf|woff|woff2);base64,[A-Za-z0-9+/=]+$/.test(record.data)||record.data.length>14000000)throw Error('Invalid font');const face=new FontFace(record.name,`url(${record.data})`);await face.load();document.fonts.add(face);vfFonts.set(record.name,record);vfRefresh()}
async function vfLocal(name){name=name.trim().replace(/["\\]/g,'');if(!name){toast('পিসিতে থাকা ফন্টের নাম লিখুন');return false}if(!['SolaimanLipi','Kalpurush','Hind Siliguri'].includes(name)&&!vfFonts.has(name)){try{const face=new FontFace(name,`local("${name}")`);await face.load();document.fonts.add(face);vfFonts.set(name,{name,local:true});vfRefresh()}catch{toast('এই ফন্ট পিসিতে পাওয়া যায়নি। ফন্ট ফাইল যোগ করুন।');return false}}return true}
async function vfApply(name,scope){if(!await vfLocal(name))return;if(scope==='selection'){if(!browserRange||browserRange.collapsed){toast('আগে কাগজের লেখা নির্বাচন করুন');return}format('fontName',name)}else{plPage().style.fontFamily='"'+name+'", SolaimanLipi, sans-serif';browserPersist()}toast('ফন্ট প্রয়োগ হয়েছে')}
async function vfZipEntries(buffer){const bytes=new Uint8Array(buffer),view=new DataView(buffer);let end=-1;for(let i=bytes.length-22;i>=Math.max(0,bytes.length-65557);i--)if(view.getUint32(i,true)===0x06054b50){end=i;break}if(end<0)throw Error('Invalid ZIP');const count=view.getUint16(end+10,true);if(count>2000)throw Error('ZIP too large');let at=view.getUint32(end+16,true),total=0;const result=[];for(let i=0;i<count;i++){if(view.getUint32(at,true)!==0x02014b50)throw Error('Invalid ZIP');const flags=view.getUint16(at+8,true),method=view.getUint16(at+10,true),compressed=view.getUint32(at+20,true),size=view.getUint32(at+24,true),nameLength=view.getUint16(at+28,true),extraLength=view.getUint16(at+30,true),commentLength=view.getUint16(at+32,true),local=view.getUint32(at+42,true),name=new TextDecoder().decode(bytes.subarray(at+46,at+46+nameLength));at+=46+nameLength+extraLength+commentLength;if(!/\.(ttf|otf|woff2?)$/i.test(name)&&name!=='word/document.xml')continue;if(flags&1)throw Error('Encrypted ZIP');total+=size;if(size>10000000||total>30000000)throw Error('ZIP too large');if(view.getUint32(local,true)!==0x04034b50)throw Error('Invalid ZIP');const start=local+30+view.getUint16(local+26,true)+view.getUint16(local+28,true);let data=bytes.slice(start,start+compressed);if(method===8){const stream=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));const reader=stream.getReader(),parts=[];let length=0;while(true){const chunk=await reader.read();if(chunk.done)break;length+=chunk.value.length;if(length>10000000){await reader.cancel();throw Error('ZIP too large')}parts.push(chunk.value)}data=new Uint8Array(length);let offset=0;for(const part of parts){data.set(part,offset);offset+=part.length}}else if(method!==0)throw Error('Unsupported ZIP');if(data.length!==size)throw Error('Invalid ZIP');result.push({name,data})}return result}
function vfPickFonts(){const custom=document.querySelector('#custom-font-name')?.value.trim()||'';pickLocalFile('.ttf,.otf,.woff,.woff2,.zip,.json',async file=>{try{if(file.size>30000000)throw Error('Large file');let records=[];if(/\.json$/i.test(file.name)){const pack=JSON.parse(await file.text());if(pack.app!=='MadrasaManager-fonts'||!Array.isArray(pack.fonts)||pack.fonts.length>100)throw Error();records=pack.fonts}else{const entries=/\.zip$/i.test(file.name)?await vfZipEntries(await file.arrayBuffer()):[{name:file.name,data:new Uint8Array(await file.arrayBuffer())}];records=entries.filter(e=>/\.(ttf|otf|woff2?)$/i.test(e.name)).map((e,i)=>({name:entries.length===1&&custom?custom:e.name.split('/').pop().replace(/\.[^.]+$/,''),data:vfDataURL(e.data)}))}if(!records.length)throw Error('No fonts');let count=0;for(const record of records)try{await vfInstall(record);count++}catch{}if(!count)throw Error('Failed');toast(count+'টি ফন্ট এই সেশনে যোগ হয়েছে')}catch{toast('ফন্ট ফাইল পড়া যায়নি। TTF/OTF/WOFF বা সাধারণ ZIP দিন।')}})}
function vfManager(){modal('অফলাইন ফন্ট স্টোর ও ম্যানেজার','<p>SolaimanLipi Regular/Bold, Kalpurush ও Hind Siliguri মূল ফাইলের ভেতরে আছে। পিসির অন্যান্য ফন্ট ওই পিসিতে থাকলে ব্যবহার করা যায়।</p><div class="vf-font-list">'+[...vfFonts.values()].map(f=>`<p><strong>${browserEscape(f.name)}</strong> — ${f.local?'এই পিসির ফন্ট':'লোকাল ফাইল থেকে সংরক্ষিত'}</p>`).join('')+'</div><button class="primary" data-action="vf:font-file">ফন্ট / ZIP / ফন্ট ব্যাকআপ যোগ করুন</button><button class="primary" data-action="vf:font-backup">ফন্ট ব্যাকআপ ডাউনলোড</button><p>যোগ করা ফন্ট শুধু চলতি সেশনে থাকে — এই বিল্ডে কোনো ফন্ট ডাটাবেস নেই।</p>')}
function vfTextFile(){pickLocalFile('.txt,.html,.htm,.docx',async file=>{try{if(file.size>15000000)throw Error();let text;if(/\.docx$/i.test(file.name)){const entries=await vfZipEntries(await file.arrayBuffer()),entry=entries.find(e=>e.name==='word/document.xml');if(!entry)throw Error();const doc=new DOMParser().parseFromString(new TextDecoder().decode(entry.data),'application/xml');if(doc.querySelector('parsererror'))throw Error();text=[...doc.getElementsByTagNameNS('*','p')].map(p=>[...p.getElementsByTagNameNS('*','t')].map(t=>t.textContent).join('')).join('\n')}else if(/\.html?$/i.test(file.name)){const doc=new DOMParser().parseFromString(await file.text(),'text/html');doc.querySelectorAll('script,style,iframe,object').forEach(n=>n.remove());text=doc.body.textContent}else text=await file.text();format('insertText',text);toast('ফাইলের লেখা যোগ হয়েছে; মূল ফরম্যাট আনা হয়নি')}catch{toast('ফাইলটি পড়া যায়নি। TXT, HTML বা DOCX ফাইল দিন।')}})}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action^="vf:"]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();const a=b.dataset.action.slice(3);if(a==='font-file')vfPickFonts();else if(a==='local-font')await vfLocal(document.querySelector('#vf-local-name').value);else if(a.startsWith('local:')){const name=a.slice(6);if(await vfLocal(name))await vfApply(name,'page')}else if(a==='page'||a==='selection')await vfApply(document.querySelector('[aria-label="ফন্ট লিস্ট"]').value,a);else if(a==='manager')vfManager();else if(a==='font-backup')toast('এই ডিজাইনে ফন্ট ব্যাকআপ ফাইল সেভ হয় না');else if(a==='text-file')vfTextFile();else if(a==='ocr')modal('ছবি / PDF থেকে লেখা','<p>ছবি ও স্ক্যান করা PDF থেকে লেখা শনাক্ত করার OCR ইঞ্জিন এই ব্রাউজার সংস্করণে এখনো যুক্ত হয়নি। এই কাজের জন্য ইন্টারনেট ব্যবহার করা হবে না।</p><p>TXT, HTML ও DOCX ফাইলের লেখা এখন অফলাইনে আনা যায়। DOCX-এর শুধু লেখা আনা হবে।</p><button class="primary" data-action="vf:text-file">লেখার ফাইল খুলুন</button>')},true);

function ssPageColumns(n,line=false){const p=browserActive||browserPages()[0];p.style.columnCount='1';let wrap=p.querySelector(':scope > .ss-page-columns');if(n===1){if(wrap){for(const cell of [...wrap.children])while(cell.firstChild)wrap.before(cell.firstChild);wrap.remove()}ssCommit();return}if(!wrap){wrap=document.createElement('div');wrap.className='ss-page-columns';const first=document.createElement('div');first.className='ss-page-cell';for(const child of [...p.childNodes]){if(child.nodeType===1&&child.matches('.page-number-note,.pl-frame,.pl-watermark,.ip-page-number,.ip-running-header,.ip-running-footer,.ip-question-header'))continue;first.append(child)}if(!first.textContent.trim()&&!first.querySelector('img,table'))first.innerHTML='<p><br></p>';wrap.append(first);p.prepend(wrap)}while(wrap.children.length>n){const last=wrap.lastElementChild;while(last.firstChild)wrap.children[n-1].append(last.firstChild);last.remove()}while(wrap.children.length<n){const cell=document.createElement('div');cell.className='ss-page-cell';cell.innerHTML='<p><br></p>';wrap.append(cell)}const style=getComputedStyle(p);wrap.style.cssText=`display:grid;grid-template-columns:repeat(${n},minmax(0,1fr));gap:28px;min-height:${Math.max(300,parseFloat(style.minHeight)-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom)-35)}px;align-items:stretch`;[...wrap.children].forEach((c,i)=>{c.style.cssText=`min-width:0;overflow-wrap:anywhere;${i?'border-left:1px '+(line?'solid #0b1f3a':'dashed #d3deed')+';padding-left:14px':''}`});ssFocusStart(wrap.firstElementChild);ssCommit()}

document.addEventListener('click',async e=>{const b=e.target.closest('button[data-action^="ss:"]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();const [a,...parts]=b.dataset.action.slice(3).split(':'),v=parts.join(':');if(a==='palette'){ssPalette=!ssPalette;ssHome()}else if(a==='ink'||a==='fill'){format(a==='ink'?'foreColor':'hiliteColor',v)}else if(a==='page-toggle'){const p=browserActive||browserPages()[0];ssPageColumns(p.querySelector('.ss-page-columns')?1:2)}else if(a==='studio')ssStudio();else if(a==='tab')ssStudio(+v);else if(a==='close')ssClose();else if(a==='preset'){ssPreset=v;ssApplyPreset()}else if(a==='section')ssInsert(ssSectionHTML(ssPreset));else if(a==='page'){ssPageColumns(+v,ssQ('#ss-page-line').checked);ssClose()}else if(a==='ready')ssReadyInsert(+v);else if(a==='options'){const labels={bn:['ক','খ','গ','ঘ'],en:['a','b','c','d'],ar:['أ','ب','ج','د']}[ssQ('#ss-labels').value];const cells=labels.map((x,i)=>`<div>(${x}) ${ssEsc(ssQ('#ss-option-'+i).value||'________')}</div>`).join('');ssInsert(`<div class="ss-options" style="display:grid;grid-template-columns:repeat(${ssQ('#ss-option-cols').value},minmax(0,1fr));gap:10px;margin:10px 0">${cells}</div><p><br></p>`)}else if(a==='fraction'){const n=ssQ('#ss-num').value,d=ssQ('#ss-den').value;if(ssValid(n,d))ssInsert(ssFraction(ssQ('#ss-whole').value,n,d,ssQ('#ss-bracket').value,ssQ('#ss-slash').checked)+'&nbsp;')}else if(a==='equation'){const av=['w','n','d'].map(x=>ssQ('#ss-a-'+x).value),bv=['w','n','d'].map(x=>ssQ('#ss-b-'+x).value);if(ssValid(av[1],av[2])&&ssValid(bv[1],bv[2]))ssInsert(ssFraction(...av)+' '+ssEsc(ssQ('#ss-op').value)+' '+ssFraction(...bv)+' '+ssEsc(ssQ('#ss-answer').value)+'&nbsp;')}else if(a==='quick'){const list=[['','১','২'],['','১','৩'],['','২','৩'],['','১','৪'],['','৩','৪'],['','২','৫'],['','৩','৫'],['','৫','৮'],['১','১','২'],['২','১','৩'],['৩','৩','৪'],['','ক','খ'],['','x','y'],['','a + b','a − b']];ssInsert(ssFraction(...list[+v])+'&nbsp;')}else if(a==='convert'){ function pzSet(value,fit=false){
 const old=pzValue;pzValue=Math.max(25,Math.min(200,Math.round(Number(value)||100)));pzFit=fit;
 pzWorkspace.style.setProperty('--page-view-zoom',pzValue/100);
 pzSlider.value=String(pzValue);pzSlider.setAttribute('aria-valuetext',pzValue+'%');
 document.querySelector('#zoom-value').textContent=pzValue+'%';
 document.querySelector('[data-action="fit"]').setAttribute('aria-pressed',String(fit));
 if(old!==pzValue)pzWorkspace.scrollTop=Math.round(pzWorkspace.scrollTop*pzValue/old);
 
}
function pzFitPage(){
 const p=browserActive||browserPages()[0];if(!p)return;
 const s=getComputedStyle(pzWorkspace),width=pzWorkspace.clientWidth-parseFloat(s.paddingLeft)-parseFloat(s.paddingRight)-12,height=pzWorkspace.clientHeight-parseFloat(s.paddingTop)-parseFloat(s.paddingBottom)-12;
 pzSet(Math.floor(Math.min(width/p.offsetWidth,height/p.offsetHeight,2)*100),true);
 p.scrollIntoView({block:'center',inline:'nearest'});
}

document.addEventListener('click',e=>{const b=e.target.closest('button[data-action^="cg:"]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();const [a,...rest]=b.dataset.action.slice(3).split(':'),v=rest.join(':');if(a==='open')cgOpen();else if(a==='tab')cgOpen(+v);else if(a==='frame-category'){cgState.frameCategory=v;document.querySelectorAll('[data-action^="cg:frame-category:"]').forEach(el=>el.classList.toggle('active',el===b));cgRenderCards()}else if(a==='category'){cgState.category=+v;cgOpen(0)}else if(a==='select')cgSelect(+v);else if(a==='insert'){if(v!=='')cgSelect(+v);cgInsert()}else if(a==='color'){cgState.color=v;document.querySelector('#cg-color').value=v;cgPreview();cgRenderCards()}else if(a==='fill'){cgState.fill=v;cgPreview();cgRenderCards()}else if(a==='mode'){cgState.mode=v;document.querySelectorAll('[data-action^="cg:mode:"]').forEach(n=>n.classList.toggle('active',n===b))}else if(a==='frame'){cgState.frame=+v;cgRenderCards();cgPreview()}else if(a==='apply-frame'){if(v!=='')cgState.frame=+v;cgApplyFrame()}else if(a==='bism'){cgState.bismText=[cgBism,'بِاسْمِهِ سُبْحَانَهُ وَتَعَالَى','بِسْمِ اللَّهِ'][+v];document.querySelector('#cg-bism-text').value=cgState.bismText;cgPreview()}},true);

let cgDrag=null;document.addEventListener('pointerdown',e=>{const el=e.target.closest('.cg-float');if(!el||!e.altKey)return;e.preventDefault();const p=el.closest('.paper'),z=p.getBoundingClientRect().width/p.offsetWidth;cgDrag={el,p,z,x:e.clientX,y:e.clientY,left:parseFloat(el.style.left)||0,top:parseFloat(el.style.top)||0};el.setPointerCapture(e.pointerId)});document.addEventListener('pointermove',e=>{if(!cgDrag)return;const d=cgDrag;d.el.style.left=Math.max(0,Math.min(d.p.clientWidth-d.el.offsetWidth,d.left+(e.clientX-d.x)/d.z))+'px';d.el.style.top=Math.max(0,Math.min(d.p.clientHeight-d.el.offsetHeight,d.top+(e.clientY-d.y)/d.z))+'px'});document.addEventListener('pointerup',()=>{if(cgDrag){cgDrag=null;browserPersist()}});cgWire();

function ipShapeSVG(item,state=ipShapeState){return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none" style="display:block;width:100%;height:100%;overflow:visible"><g fill="${state.fill}" stroke="${state.stroke}" stroke-width="${state.weight}" stroke-linecap="round" stroke-linejoin="round" ${state.dash==='dashed'?'stroke-dasharray="6 4"':state.dash==='dotted'?'stroke-dasharray="1 4"':''}>${item.svg}</g></svg>`}
function ipShapeHTML(s){return `<div class="ip-shape-object" data-ip-shape="${ipEsc(JSON.stringify(s))}" style="display:inline-block;position:relative;vertical-align:middle;width:${s.width}px;height:${s.height}px;max-width:100%;margin:10px;resize:both;overflow:hidden">${ipShapeSVG(ipShapes[s.index],s)}<div style="position:absolute;inset:25% 15%;display:flex;align-items:center;justify-content:${{left:'flex-start',center:'center',right:'flex-end'}[s.align]};color:${s.ink};text-align:${s.align};font-size:16px;overflow-wrap:anywhere">${ipEsc(s.text)}</div></div>`}

let ipChart={title:'ফলাফলের তুলনা',type:'bar',color:'#17365b',data:'বাংলা, ৭৮\nইংরেজি, ৬৫\nগণিত, ৯০\nবিজ্ঞান, ৭২'};
const ipNumber=x=>Number(String(x).replace(/[০-৯]/g,d=>'০১২৩৪৫৬৭৮৯'.indexOf(d)).trim());
function ipChartData(raw){return raw.split('\n').filter(x=>x.trim()).map(line=>{const i=Math.max(line.lastIndexOf(','),line.lastIndexOf(':'));if(i<1)throw Error('প্রতি লাইনে নাম, মান লিখুন।');const name=line.slice(0,i).trim(),value=ipNumber(line.slice(i+1));if(!Number.isFinite(value)||value<0)throw Error('মান শূন্য বা ধনাত্মক সংখ্যা হতে হবে।');return{name,value}})}
function ipChartHTML(s){const data=ipChartData(s.data);if(!data.length||data.length>20)throw Error('১ থেকে ২০টি তথ্য দিন।');const max=Math.max(1,...data.map(d=>d.value)),sum=data.reduce((n,d)=>n+d.value,0),step=540/data.length;let shapes='',labels='';const text=(x,y,t,size=14,anchor='middle')=>`<text x="${x}" y="${y}" text-anchor="${anchor}" fill="#0b1f3a" font-family="SolaimanLipi,Arial" font-size="${size}">${ipEsc(t)}</text>`;
if(s.type==='pie'){if(!sum)throw Error('পাই চার্টের অন্তত একটি মান শূন্যের বেশি দিন।');let angle=-Math.PI/2;data.forEach((d,i)=>{const end=angle+d.value/sum*Math.PI*2,x=230+120*Math.cos(angle),y=190+120*Math.sin(angle),xx=230+120*Math.cos(end),yy=190+120*Math.sin(end);shapes+=d.value===sum?`<circle cx="230" cy="190" r="120" fill="${s.color}"/>`:`<path d="M230 190L${x} ${y}A120 120 0 ${end-angle>Math.PI?1:0} 1 ${xx} ${yy}Z" fill="${s.color}" fill-opacity="${.3+.7*(i+1)/data.length}" stroke="white"/>`;labels+=text(410,65+i*14,`${d.name}: ${d.value} (${(d.value/sum*100).toFixed(1)}%)`,12,'start');angle=end})}else if(s.type==='horizontal'){data.forEach((d,i)=>{const y=50+i*280/data.length;shapes+=`<rect x="125" y="${y}" width="${d.value/max*405}" height="${Math.min(30,200/data.length)}" rx="3" fill="${s.color}"/>`;labels+=text(115,y+14,d.name,13,'end')+text(135+d.value/max*405,y+14,d.value,12,'start')})}else{shapes='<path d="M55 45V315H605" fill="none" stroke="#74859b"/>';let points=[];data.forEach((d,i)=>{const x=65+i*step+step/2,y=310-d.value/max*235;if(s.type==='line'){points.push(`${x},${y}`);shapes+=`<circle cx="${x}" cy="${y}" r="5" fill="${s.color}"/>`}else shapes+=`<rect x="${x-step*.32}" y="${y}" width="${step*.64}" height="${310-y}" rx="3" fill="${s.color}"/>`;labels+=text(x,y-10,d.value,13)+text(x,337,d.name,Math.max(9,Math.min(14,110/data.length)))});if(s.type==='line')shapes+=`<polyline points="${points.join(' ')}" fill="none" stroke="${s.color}" stroke-width="3"/>`}
return `<figure class="ip-chart-object" data-ip-chart="${ipEsc(JSON.stringify(s))}" style="margin:16px auto;max-width:100%;width:620px;border:1px solid #c9d5e4;padding:12px;border-radius:8px;break-inside:avoid"><figcaption style="text-align:center;font-weight:bold;color:#0b1f3a">${ipEsc(s.title)}</figcaption><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" style="display:block;width:100%;height:auto">${shapes}${labels}</svg></figure>`}

function ipOpenDate(){const now=new Date(),iso=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');ipModal('তারিখ যুক্ত করুন',`${ipField('date-value','তারিখ',iso,'date')}${ipSelect('date-language','ভাষা',[['bn-BD','বাংলা'],['en-GB','English']],'bn-BD')}${ipSelect('date-style','নকশা',[['normal','সাধারণ লেখা'],['art','বড় শিরোনাম ও ছায়া']],'art')}<div id="ip-date-preview" class="ip-preview"></div><footer>${ipBtn('বাতিল','close')}${ipBtn('তারিখ বসান','date-insert',true)}</footer>`);ipQ('#ip-date-preview').textContent=ipDateText()}
function ipOpenLink(){const sel=browserRange?.toString()||'';ipModal('হাইপারলিংক',`<p class="ip-hint">ডকুমেন্টে একটি নামের সঙ্গে ওয়েব ঠিকানা যুক্ত করুন।</p>${ipField('link-label','দেখানোর লেখা',sel)}${ipField('link-url','ওয়েব ঠিকানা','https://','url')}<p class="ip-hint">পেজে লিংক খুলতে Ctrl চেপে ক্লিক করুন।</p><footer>${ipBtn('বাতিল','close')}${ipBtn('লিংক যুক্ত করুন','link-insert',true)}</footer>`)}
const ipPreviousAction=ixAction;ixAction=function(a,b){const routes={shape:ipOpenShapes,chart:ipOpenChart,link:ipOpenLink,header:ipOpenHeader,footer:()=>ipOpenHF(true),number:ipOpenNumbers,'header-footer':ipOpenHF,textbox:()=>ipInsertObject('<div class="ip-textbox" style="border:2px solid #17365b;background:#f0f5fb;border-radius:8px;padding:14px 18px;margin:15px 0;color:#17365b"><b>দ্রষ্টব্য / উদ্দীপক:</b><p>এখানে আপনার উদ্দীপক, অনুচ্ছেদ বা গুরুত্বপূর্ণ নোট লিখুন…</p></div>'),wordart:ipOpenWord,dropcap:ipDropCap,signature:ipOpenSignature,date:ipOpenDate,math:ipOpenMath};if(routes[a]){ipEditing=null;routes[a]();return true}return ipPreviousAction(a,b)};
function ipError(e){let box=ipQ('.ip-error');if(!box){box=document.createElement('p');box.className='ip-error';box.setAttribute('role','alert');ipQ('.ip-body').prepend(box)}box.textContent=e.message}
function ipValue(id){return ipQ('#ip-'+id).value}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action^="ip:"]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();const a=b.dataset.action.slice(3),[cmd,arg]=a.split(':');try{
if(cmd==='close'){ssClose();return}
if(cmd==='shape-cat'){ipShapeState.category=arg;ipShapeRender()}
if(cmd==='shape-select'){ipShapeState.index=+arg;ipShapeRender()}
if(cmd==='shape-clear-fill'){ipShapeState.fill='none';ipShapeRender()}
if(cmd==='shape-clear-border'){ipShapeState.weight=0;ipQ('#ip-shape-weight').value=0;ipShapeRender()}
if(cmd==='shape-insert')ipInsertObject(ipShapeHTML(ipShapeState));
if(cmd==='chart-insert')ipInsertObject(ipChartHTML(ipChart));
if(cmd==='header-apply')ipApplyHeader();
if(cmd==='logo-remove'){ipHeader.logo='';ipQ('#ip-logo-preview')?.replaceChildren()}
if(cmd==='hf-apply')ipApplyHF();
if(cmd==='number-apply'||cmd==='number-remove'){browserPages().forEach(p=>p.querySelectorAll('.ip-page-number').forEach(n=>n.remove()));if(cmd==='number-apply'){const start=Math.max(1,Math.floor(+ipValue('num-start')||1));for(const p of browserPages())p.insertAdjacentHTML('beforeend',`<div class="ip-page-number" contenteditable="false" data-start="${start}" data-format="${ipValue('num-format')}" style="position:absolute;bottom:12px;left:7%;right:7%;font-size:11px;text-align:${ipValue('num-align')}"></div>`)}ssClose();browserFooter();browserPersist()}
if(cmd==='math-tab')ipOpenMath(+arg);
if(cmd==='math-preset')ipInsertObject('<div style="margin:16px 0">'+ipMathTemplate(arg)+'</div>');
if(cmd==='math-custom'){const nums=Array.from({length:+arg},(_,i)=>ipValue('math-'+i).trim());if(nums.some(n=>!n||!Number.isFinite(ipNumber(n))))throw Error('প্রতিটি ঘরে সঠিক সংখ্যা লিখুন');ipInsertObject('<div style="margin:16px 0">'+ipVertical(nums,ipMathTab===1?'−':'+')+'</div>')}
if(cmd==='word-insert')ipInsertObject(ipWordHTML(ipWord));
if(cmd==='signature-insert')ipInsertObject(`<div class="ip-signature" style="display:flex;justify-content:space-between;gap:35px;margin:60px 15px 25px;break-inside:avoid">${['left','right'].map(side=>`<div style="width:35%;border-top:1px solid #17365b;text-align:center;padding-top:7px">${ipEsc(ipValue('sign-'+side))}</div>`).join('')}</div>`);
if(cmd==='date-insert'){const t=ipDateText();ipInsertObject(ipValue('date-style')==='art'?ipWordHTML({text:t,size:48,color:'#17365b',style:'shadow'}):'<p>'+ipEsc(t)+'</p>')}
if(cmd==='link-insert'){let raw=ipValue('link-url').trim();let url;try{url=new URL(raw)}catch{throw Error('সম্পূর্ণ ওয়েব ঠিকানা লিখুন, যেমন https://example.com')}if(!['http:','https:'].includes(url.protocol)||/\s/.test(raw))throw Error('http বা https ওয়েব ঠিকানা ব্যবহার করুন');ipInsertObject(`<a href="${ipEsc(url.href)}" target="_blank" rel="noopener noreferrer">${ipEsc(ipValue('link-label').trim()||url.href)}</a>`)}
}catch(err){ipError(err)}},true);
function ipInput(e){const id=e.target.id;if(!id.startsWith('ip-'))return;try{if(id.startsWith('ip-shape-')){let k=id.slice(9);if(k==='search')k='query';let v=e.target.value;if(['width','height','weight'].includes(k))v=Math.max(k==='weight'?0:30,Math.min(k==='weight'?12:800,+v||0));ipShapeState[k]=v;ipShapeRender()}
if(id.startsWith('ip-chart-')){ipChart[id.slice(9)]=e.target.value;ipChartPreview()}
if(id.startsWith('ip-word-')){const k=id.slice(8);ipWord[k]=k==='size'?Math.max(8,Math.min(120,+e.target.value||36)):e.target.value;ipQ('#ip-word-preview').innerHTML=ipWordHTML(ipWord)}
if(id.startsWith('ip-date-'))ipQ('#ip-date-preview').textContent=ipDateText();
if(id.startsWith('ip-math-'))ipMathNums[+id.slice(8)]=e.target.value;
if(e.target.type==='file'&&id.includes('logo')){const f=e.target.files[0];if(!f)return;if(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>2*1024*1024)throw Error('২ এমবির মধ্যে PNG, JPG অথবা WebP লোগো নির্বাচন করুন');const reader=new FileReader();reader.onload=()=>{ipHeader.logo=reader.result;const preview=ipQ('#ip-logo-preview');if(preview)preview.innerHTML=`<img src="${reader.result}" alt="প্রতিষ্ঠানের লোগো">`};reader.readAsDataURL(f)}
}catch(err){ipError(err)}}document.addEventListener('input',ipInput);document.addEventListener('change',e=>{if(e.target.type==='file')ipInput(e)});
document.addEventListener('dblclick',e=>{const el=e.target.closest('.ip-shape-object,.ip-chart-object,.ip-wordart');if(!el)return;try{ipEditing=el;if(el.dataset.ipShape){ipShapeState=JSON.parse(el.dataset.ipShape);ipOpenShapes()}else if(el.dataset.ipChart){ipChart=JSON.parse(el.dataset.ipChart);ipOpenChart()}else{ipWord={...JSON.parse(el.dataset.ipWord),text:el.textContent};ipOpenWord()}}catch{ipEditing=null}});

/* Exam workflow helpers: composition, checks, named recovery versions. */
const ewEsc=browserEscape;
let ewDraftStart=0;let ewDraft=[{text:'',options:'',answer:'ক',marks:'১',type:'mcq'}];
const ewButton=(name,action,primary=false)=>`<button data-action="ew:${action}" class="${primary?'primary':''}">${name}</button>`;
function ewOpen(title,body){ipModal(title,body,true)}
function ewHome(){ewOpen('সহায়ক টুলস',`<div class="ew-cards"><section><h3>প্রশ্ন ও উত্তরপত্র</h3><p>MCQ ও সংক্ষিপ্ত প্রশ্ন সাজান, নম্বর দিন এবং আলাদা উত্তরপত্র তৈরি করুন।</p>${ewButton('প্রশ্ন তৈরি করুন','builder',true)}</section><section><h3>প্রিন্টের আগে যাচাই</h3><p>পূর্ণমান, ফাঁকা পৃষ্ঠা এবং পৃষ্ঠার সীমানার বাইরে থাকা লেখা পরীক্ষা করুন।</p>${ewButton('ডকুমেন্ট যাচাই','check',true)}</section><section><h3>সংরক্ষিত সংস্করণ</h3><p>গুরুত্বপূর্ণ ধাপে কাজের একটি সংস্করণ রাখুন। পুরোনো সংস্করণ আলাদা কপি হিসেবে খুলুন।</p>${ewButton('সংস্করণ দেখুন','history',true)}</section></div>`)}
function ewRead(){document.querySelectorAll('.ew-question').forEach((row,i)=>{for(const el of row.querySelectorAll('[data-field]'))ewDraft[i][el.dataset.field]=el.value})}
function ewBuilder(){ewOpen('প্রশ্ন ও উত্তরপত্র তৈরি',`<p class="ip-hint">MCQ-এর চারটি অপশন আলাদা লাইনে লিখুন। সঠিক উত্তর শুধু আলাদা উত্তরপত্রে থাকবে।</p><div id="ew-questions">${ewDraft.map((q,i)=>`<section class="ew-question ip-box"><div class="ew-row"><b>প্রশ্ন ${dvNumberText(i+1)}</b>${ewButton('সরান','remove:'+i)}</div><div class="ip-grid"><label>ধরন<select data-field="type"><option value="mcq" ${q.type==='mcq'?'selected':''}>MCQ</option><option value="short" ${q.type==='short'?'selected':''}>সংক্ষিপ্ত প্রশ্ন</option></select></label><label>নম্বর<input data-field="marks" value="${ewEsc(q.marks)}" inputmode="decimal"></label></div><label>প্রশ্ন<textarea data-field="text">${ewEsc(q.text)}</textarea></label><label>MCQ অপশন — প্রতি লাইনে একটি<textarea data-field="options">${ewEsc(q.options)}</textarea></label><label>উত্তর — MCQ-এর ক্ষেত্রে ক / খ / গ / ঘ<input data-field="answer" value="${ewEsc(q.answer)}"></label></section>`).join('')}</div><div class="ip-actions">${ewButton('+ আরেকটি প্রশ্ন','add')}</div><footer>${ewButton('আলাদা উত্তরপত্র তৈরি','answers')}${ewButton('এই পৃষ্ঠায় প্রশ্ন বসান','insert',true)}</footer>`)}
function ewValidate(){ewRead();return ewDraft.map((q,i)=>{const marks=ipNumber(q.marks),options=q.options.split('\n').map(x=>x.trim()).filter(Boolean);if(!q.text.trim())throw Error(`প্রশ্ন ${i+1}-এর লেখা দিন`);if(!Number.isFinite(marks)||marks<=0||marks>1000)throw Error(`প্রশ্ন ${i+1}-এ ০-এর বেশি নম্বর দিন`);if(q.type==='mcq'&&(options.length!==4||!['ক','খ','গ','ঘ'].includes(q.answer.trim())))throw Error(`প্রশ্ন ${i+1}-এ চারটি অপশন এবং ক/খ/গ/ঘ উত্তর দিন`);return {...q,text:q.text.trim(),marks,options,answer:q.answer.trim()}})}
function ewQuestionHTML(q,i){return `<section class="ew-exam-question" data-ew-marks="${q.marks}" style="margin:12px 0;break-inside:avoid"><div style="display:flex;gap:16px;justify-content:space-between"><div><b>${dvNumberText(i+1)}। </b>${ewEsc(q.text).replaceAll('\n','<br>')}</div><span style="white-space:nowrap">[${dvNumberText(q.marks)}]</span></div>${q.type==='mcq'?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;margin:10px 0 0 22px">${q.options.map((o,j)=>'<div>('+['ক','খ','গ','ঘ'][j]+') '+ewEsc(o)+'</div>').join('')}</div>`:'<p style="color:#8b95a3">................................................................................</p>'}</section>`}
function ewInsert(){const questions=ewValidate(),count=document.querySelectorAll('.paper .ew-exam-question').length;ewDraftStart=count;ssInsert(questions.map((q,i)=>ewQuestionHTML(q,i+count)).join('')+'<p><br></p>');toast(`${dvNumberText(questions.length)}টি প্রশ্ন যুক্ত হয়েছে`)}
function ewAnswers(){const qs=ewValidate(),title=browserCurrent.title+' — উত্তরপত্র';const html='<h2 style="text-align:center">উত্তরপত্র</h2>'+qs.map((q,i)=>`<p><b>${dvNumberText(i+1+ewDraftStart)}।</b> ${ewEsc(q.answer||'উত্তর লিখুন')} <span style="float:right">[${dvNumberText(q.marks)}]</span></p>`).join('');browserNew(title,html);toast('উত্তরপত্র আলাদা ডকুমেন্টে তৈরি হয়েছে')}
function ewHistory(){browserPersist();const history=browserCurrent.ewHistory||[];ewOpen('সংরক্ষিত সংস্করণ',`<p>এই ডকুমেন্টের সর্বশেষ ১২টি সংস্করণ রাখা হয়। পুরোনো সংস্করণ খুললে নতুন ডকুমেন্ট তৈরি হবে। ব্যাকআপ ফাইলেও সংস্করণগুলো থাকবে।</p>${ipField('ew-version','সংস্করণের নাম','খসড়া '+new Date().toLocaleString('bn-BD'))}${ewButton('বর্তমান সংস্করণ রাখুন','snapshot',true)}<div class="ew-history">${history.slice().reverse().map((v,i)=>`<section><div><b>${ewEsc(v.name)}</b><small>${ewEsc(new Date(v.date).toLocaleString('bn-BD'))} · ${dvNumberText(v.pages.length)} পৃষ্ঠা</small></div>${ewButton('কপি হিসেবে খুলুন','restore:'+(history.length-1-i))}</section>`).join('')||'<p class="ip-hint">এখনও কোনো সংস্করণ রাখা হয়নি।</p>'}</div>`)}
function ewSnapshot(){const name=document.querySelector('#ip-ew-version').value.trim();if(!name)throw Error('সংস্করণের নাম লিখুন');const snapshot={name,date:new Date().toISOString(),pages:browserSnapshot(),questionHeader:browserCurrent.questionHeader?JSON.parse(JSON.stringify(browserCurrent.questionHeader)):null};browserCurrent.ewHistory=[...(browserCurrent.ewHistory||[]),snapshot].slice(-12);browserPersist();ewHistory()}
function ewRestore(index){const v=browserCurrent.ewHistory?.[index];if(!v)throw Error('সংস্করণ পাওয়া যায়নি');browserPersist();const record={id:browserId(),title:browserCurrent.title+' — '+v.name,pages:JSON.parse(JSON.stringify(v.pages)),questionHeader:v.questionHeader?JSON.parse(JSON.stringify(v.questionHeader)):undefined,updated:new Date().toISOString()};browserLibrary.push(record);browserLoad(record);toast('সংরক্ষিত সংস্করণ আলাদা কপি হিসেবে খোলা হয়েছে')}
function ewFindings(){const results=[],pages=browserPages();let total=0,count=0;pages.forEach((p,i)=>{const clone=p.cloneNode(true);clone.querySelectorAll('.page-number-note,.ip-page-number,.pl-watermark,.ip-running-header,.ip-running-footer').forEach(n=>n.remove());if(!clone.textContent.trim()&&!clone.querySelector('table,img,svg'))results.push({page:i,text:'পৃষ্ঠা ফাঁকা আছে'});const r=p.getBoundingClientRect();if(r.width&&[...p.querySelectorAll('table,img,svg,.ew-exam-question,.ip-textbox,p')].some(el=>{const c=el.getBoundingClientRect();return c.right>r.right+2||c.bottom>r.bottom+2||c.left<r.left-2}))results.push({page:i,text:'কিছু লেখা বা বস্তু পৃষ্ঠার সীমানা ছাড়িয়েছে'});p.querySelectorAll('.ew-exam-question').forEach(q=>{count++;const mark=+q.dataset.ewMarks;if(Number.isFinite(mark))total+=mark})});const target=ipNumber(browserCurrent.questionHeader?.marks||'');if(count&&target>0&&Math.abs(total-target)>.001)results.push({page:0,text:`প্রশ্নের মোট নম্বর ${dvNumberText(total)}, হেডারের পূর্ণমান ${dvNumberText(target)} — মিলছে না`});if(!pages.some(p=>p.querySelector('.ip-question-header')))results.push({page:0,text:'প্রশ্নপত্রের কাঠামোবদ্ধ হেডার দেওয়া হয়নি'});return {results,total,count}}

function pmCollect(){const vals=[0,1,2,3].map(i=>document.querySelector('#pm-value-'+i).value);if(vals.some(v=>v.trim()===''||!Number.isFinite(+v)||+v<0))throw Error('চার পাশের মার্জিনে শূন্য বা ধনাত্মক সংখ্যা দিন');return vals.map(v=>+v*pmFactor())}

function bjDoMap(text,pairs){
  for(var k=0;k<pairs.length;k++){
    var pat=pairs[k][0],repl=pairs[k][1];
    text=text.replace(new RegExp(pat,'g'),(function(r){return function(){return r;};})(repl));
  }
  return text;
}
function bjIsPreKar(c){return c==='\u09bf'||c==='\u09c8'||c==='\u09c7';}
function bjIsPostKar(c){return '\u09be\u09cb\u09cc\u09d7\u09c1\u09c2\u09c0\u09c3'.indexOf(c)>=0;}
function bjIsKar(c){return bjIsPreKar(c)||bjIsPostKar(c);}
function bjIsBanjon(c){return '\u0995\u0996\u0997\u0998\u0999\u099a\u099b\u099c\u099d\u099e\u099f\u09a0\u09a1\u09a2\u09a3\u09a4\u09a5\u09a6\u09a7\u09a8\u09aa\u09ab\u09ac\u09ad\u09ae\u09af\u09b0\u09b2\u09b6\u09b7\u09b8\u09b9\u09dc\u09dd\u09df\u09ce\u0982\u0983\u0981'.indexOf(c)>=0;}
function bjIsNukta(c){return c==='\u0981';}
function bjIsHalant(c){return c==='\u09cd';}
function bjIsSpace(c){return c===' '||c==='\t'||c==='\n'||c==='\r';}
function bjCh(s,i){return (i<0||i>=s.length)?'':s[i];}
function bjSub(s,a,b){return s.substring(a,b);}
function bjReArrange(str){
  var i=0,j,temp;
  while(i<str.length){
    if(i<str.length-1&&bjCh(str,i)==='\u09b0'&&bjIsHalant(bjCh(str,i+1))&&bjIsHalant(bjCh(str,i-1))){
      j=1;
      while(true){
        if(i-j<0)break;
        if(bjIsBanjon(bjCh(str,i-j))&&bjIsHalant(bjCh(str,i-j-1)))j+=2;
        else if(j===1&&bjIsKar(bjCh(str,i-j)))j+=1;
        else break;
      }
      temp=bjSub(str,0,i-j)+bjCh(str,i)+bjCh(str,i+1)+bjSub(str,i-j,i)+bjSub(str,i+2,str.length);
      str=temp;i+=1;continue;
    }
    i+=1;
  }
  str=bjDoMap(str,BJ_PRO);
  i=0;
  while(i<str.length){
    if(i<str.length-1&&bjCh(str,i)==='\u09b0'&&bjIsHalant(bjCh(str,i+1))&&!bjIsHalant(bjCh(str,i-1))&&bjIsHalant(bjCh(str,i+2))){
      j=1;
      while(true){
        if(i-j<0)break;
        if(bjIsBanjon(bjCh(str,i-j))&&bjIsHalant(bjCh(str,i-j-1)))j+=2;
        else if(j===1&&bjIsKar(bjCh(str,i-j)))j+=1;
        else break;
      }
      temp=bjSub(str,0,i-j)+bjCh(str,i)+bjCh(str,i+1)+bjSub(str,i-j,i)+bjSub(str,i+2,str.length);
      str=temp;i+=1;continue;
    }
    if(i>0&&bjCh(str,i)==='\u09cd'&&(bjIsKar(bjCh(str,i-1))||bjIsNukta(bjCh(str,i-1)))&&i<str.length-1){
      temp=bjSub(str,0,i-1)+bjCh(str,i)+bjCh(str,i+1)+bjCh(str,i-1)+bjSub(str,i+2,str.length);
      str=temp;
    }
    if(i>0&&i<str.length-1&&bjCh(str,i)==='\u09cd'&&bjCh(str,i-1)==='\u09b0'&&bjCh(str,i-2)!=='\u09cd'&&bjIsKar(bjCh(str,i+1))){
      temp=bjSub(str,0,i-1)+bjCh(str,i+1)+bjCh(str,i-1)+bjCh(str,i)+bjSub(str,i+2,str.length);
      str=temp;
    }
    if(i<str.length-1&&bjIsPreKar(bjCh(str,i))&&!bjIsSpace(bjCh(str,i+1))){
      temp=bjSub(str,0,i);
      j=1;
      while((i+j)<str.length-1&&bjIsBanjon(bjCh(str,i+j))){
        if((i+j)<str.length&&bjIsHalant(bjCh(str,i+j+1)))j+=2;
        else break;
      }
      temp+=bjSub(str,i+1,i+j+1);
      var l=0;
      if(bjCh(str,i)==='\u09c7'&&bjCh(str,i+j+1)==='\u09be'){temp+='\u09cb';l=1;}
      else if(bjCh(str,i)==='\u09c7'&&bjCh(str,i+j+1)==='\u09d7'){temp+='\u09cc';l=1;}
      else temp+=bjCh(str,i);
      temp+=bjSub(str,i+j+l+1,str.length);
      str=temp;
      i+=j;
    }
    if(i<str.length-1&&bjIsNukta(bjCh(str,i))&&bjIsPostKar(bjCh(str,i+1))){
      temp=bjSub(str,0,i)+bjCh(str,i+1)+bjCh(str,i)+bjSub(str,i+2,str.length);
      str=temp;
    }
    i+=1;
  }
  return str;
}
function bjConvert(src){
  if(!src)return src;
  src=bjDoMap(src,BJ_PRE);
  src=bjDoMap(src,BJ_MAP);
  src=bjReArrange(src);
  src=bjDoMap(src,BJ_POST);
  return src;
}

function mmLoadScript(src){return new Promise(function(res){if(document.querySelector('script[src="'+src+'"]'))return res(true);var s=document.createElement('script');s.src=src;s.onload=function(){res(true)};s.onerror=function(){res(false)};document.head.appendChild(s);});}
function mmHideBackstage(){var b=document.querySelector('.backstage');if(b)b.classList.add('hidden');}
async function mmOpenDocx(){
  mmHideBackstage();
  await mmLoadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
  if(typeof mammoth==='undefined'){toast('ইন্টারনেট সংযোগ পাওয়া যায়নি');return;}
  var inp=document.createElement('input');inp.type='file';inp.accept='.docx,.doc';
  inp.onchange=function(){var f=inp.files[0];if(!f)return;toast('Word ফাইল পড়া হচ্ছে\u2026');
    f.arrayBuffer().then(function(buf){return mammoth.convertToHtml({arrayBuffer:buf});}).then(function(r){
      browserNew(f.name.replace(/\.(docx?)$/i,''),r.value||'<p><br></p>');toast('Word ফাইল খোলা হয়েছে');
    }).catch(function(){toast('ফাইলটি পড়া যায়নি');});};
  inp.click();
}
async function mmOpenPdf(){
  mmHideBackstage();
  await mmLoadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
  if(typeof pdfjsLib==='undefined'){toast('ইন্টারনেট সংযোগ পাওয়া যায়নি');return;}
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  var inp=document.createElement('input');inp.type='file';inp.accept='.pdf';
  inp.onchange=function(){var f=inp.files[0];if(!f)return;toast('PDF পড়া হচ্ছে\u2026');
    f.arrayBuffer().then(function(buf){return pdfjsLib.getDocument({data:buf}).promise;}).then(function(pdf){
      var chain=Promise.resolve(),html='';
      for(var p=1;p<=pdf.numPages;p++)(function(pg){
        chain=chain.then(function(){return pdf.getPage(pg);}).then(function(page){return page.getTextContent().then(function(tc){
          var lines={};
          tc.items.forEach(function(it){var y=Math.round(it.transform[5]);(lines[y]=lines[y]||[]).push(it.str);});
          var ys=Object.keys(lines).map(Number).sort(function(a,b){return b-a;});
          html+='<p><b>\u2014 পৃষ্ঠা '+pg+' \u2014</b></p>';
          ys.forEach(function(y){var t=lines[y].join(' ').trim();if(t)html+='<p>'+t.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</p>';});
        });});
      })(p);
      return chain.then(function(){browserNew(f.name.replace(/\.pdf$/i,''),html||'<p><br></p>');toast('PDF খোলা হয়েছে');});
    }).catch(function(){toast('PDF পড়া যায়নি');});};
  inp.click();
}
