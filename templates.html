<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>টেমপ্লেট গ্যালারি — Madrasa Manager</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hind Siliguri","Noto Sans Bengali",sans-serif;background:#f1f5f9;color:#0d213d}
.bar{background:#0d213d;color:#fff;padding:12px 18px;display:flex;align-items:center;gap:14px}
.bar a{color:#fff;text-decoration:none;font-size:15px}
.bar h1{font-size:18px;flex:1}
.bar button{background:#c9a227;border:none;color:#0d213d;font-weight:700;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:15px}
.cats{display:flex;gap:8px;justify-content:center;margin:16px;flex-wrap:wrap}
.cats button{border:1px solid #0d213d;background:#fff;color:#0d213d;border-radius:20px;padding:8px 22px;cursor:pointer;font-size:15px;font-family:inherit}
.cats button.sel{background:#0d213d;color:#fff}
.grid{max-width:1000px;margin:0 auto 20px;padding:0 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.tcard{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px;text-align:center;cursor:pointer;box-shadow:0 2px 8px rgba(13,33,61,.06)}
.tcard:hover{border-color:#0d213d}
.tcard .ic{font-size:36px}
.tcard h3{font-size:16px;margin:8px 0 4px}
.tcard p{font-size:13px;color:#64748b}
.work{max-width:1000px;margin:0 auto 30px;padding:0 16px;display:none}
.work.on{display:block}
.form{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:14px}
.form h3{margin-bottom:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
label.f{display:flex;flex-direction:column;font-size:14px;gap:4px;flex:1;min-width:150px}
input,textarea,select{padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px;font-family:inherit}
textarea{min-height:90px;resize:vertical}
.paper{background:#fff;padding:44px 40px;border:1px solid #e2e8f0;min-height:600px}
.paper .ph{text-align:center;border-bottom:3px double #0d213d;padding-bottom:10px;margin-bottom:14px}
.paper .ph h2{font-size:22px}.paper .ph p{font-size:13px;color:#475569}
.paper .meta{display:flex;justify-content:space-between;font-size:14px;margin:10px 0;flex-wrap:wrap;gap:6px}
.paper .qs{font-size:16px;line-height:2.1;white-space:pre-wrap}
.paper table{width:100%;border-collapse:collapse;margin-top:10px;font-size:15px}
.paper th,.paper td{border:1px solid #64748b;padding:8px;text-align:center}
.paper th{background:#f1f5f9}
.mcq2{column-count:2;column-gap:30px;font-size:16px;line-height:2}
@media print{.bar,.cats,.grid,.form{display:none!important}.work{display:block!important}body{background:#fff}.work{max-width:none;padding:0}.paper{border:none}}
</style>
</head>
<body>
<div class="bar"><a href="index.html">← সব টুলস</a><h1>🎨 টেমপ্লেট গ্যালারি</h1><button onclick="window.print()">🖨️ প্রিন্ট</button></div>
<div class="cats" id="cats"></div>
<div class="grid" id="grid"></div>
<div class="work" id="work">
<div class="form"><h3 id="wTitle"></h3><div class="row" id="wForm"></div></div>
<div class="paper" id="paper"></div>
</div>
<script>
const TPLS=[
{id:'q1',cat:'প্রশ্নপত্র',ic:'📄',t:'সাধারণ প্রশ্নপত্র',d:'হেডার + নম্বরসহ প্রশ্নের তালিকা',
 f:[['inst','প্রতিষ্ঠানের নাম'],['exam','পরীক্ষার নাম'],['cls','শ্রেণি'],['sub','বিষয়'],['time','সময়'],['marks','পূর্ণমান'],['qs','প্রশ্ন (প্রতি লাইনে একটি)',1]],
 h:d=>'<div class="ph"><h2>'+e(d.inst)+'</h2><p>'+e(d.exam)+'</p></div><div class="meta"><span>শ্রেণি: '+e(d.cls)+'</span><span>বিষয়: '+e(d.sub)+'</span><span>সময়: '+e(d.time)+'</span><span>পূর্ণমান: '+e(d.marks)+'</span></div><div class="qs">'+d.qs.split('\n').filter(x=>x.trim()).map((q,i)=>(i+1)+'। '+e(q)).join('\n')+'</div>'},
{id:'q2',cat:'প্রশ্নপত্র',ic:'☑️',t:'MCQ প্রশ্নপত্র',d:'২ কলামে বহুনির্বাচনী প্রশ্ন',
 f:[['inst','প্রতিষ্ঠানের নাম'],['exam','পরীক্ষার নাম'],['cls','শ্রেণি'],['sub','বিষয়'],['marks','পূর্ণমান'],['qs','প্রশ্ন (ফরম্যাট: প্রশ্ন | ক | খ | গ | ঘ — প্রতি লাইনে একটি)',1]],
 h:d=>'<div class="ph"><h2>'+e(d.inst)+'</h2><p>'+e(d.exam)+'</p></div><div class="meta"><span>শ্রেণি: '+e(d.cls)+'</span><span>বিষয়: '+e(d.sub)+'</span><span>পূর্ণমান: '+e(d.marks)+'</span></div><div class="mcq2">'+d.qs.split('\n').filter(x=>x.trim()).map((q,i)=>{const p=q.split('|').map(x=>e(x.trim()));return '<div>'+(i+1)+'। '+p[0]+'<br>ক) '+(p[1]||'')+'&nbsp;&nbsp;খ) '+(p[2]||'')+'<br>গ) '+(p[3]||'')+'&nbsp;&nbsp;ঘ) '+(p[4]||'')+'</div>';}).join('')+'</div>'},
{id:'t1',cat:'টেবিল প্রশ্ন',ic:'🔗',t:'মিলকরণ ছক',d:'বাম-ডান মিলকরণ টেবিল',
 f:[['inst','প্রতিষ্ঠানের নাম'],['exam','পরীক্ষার নাম'],['rows','সারি (ফরম্যাট: বাম = ডান — প্রতি লাইনে একটি)',1]],
 h:d=>'<div class="ph"><h2>'+e(d.inst)+'</h2><p>'+e(d.exam)+' — মিলকরণ</p></div><table><tr><th>বাম পাশ</th><th>ডান পাশ</th></tr>'+d.rows.split('\n').filter(x=>x.trim()).map(r=>{const p=r.split('=').map(x=>e(x.trim()));return '<tr><td>'+(p[0]||'')+'</td><td>'+(p[1]||'')+'</td></tr>';}).join('')+'</table>'},
{id:'t2',cat:'টেবিল প্রশ্ন',ic:'✏️',t:'শূন্যস্থান পূরণ',d:'নম্বরসহ শূন্যস্থানের ছক',
 f:[['inst','প্রতিষ্ঠানের নাম'],['exam','পরীক্ষার নাম'],['rows','বাক্য (_____ দিয়ে শূন্যস্থান — প্রতি লাইনে একটি)',1]],
 h:d=>'<div class="ph"><h2>'+e(d.inst)+'</h2><p>'+e(d.exam)+' — শূন্যস্থান পূরণ</p></div><div class="qs">'+d.rows.split('\n').filter(x=>x.trim()).map((q,i)=>(i+1)+'। '+e(q)).join('\n')+'</div>'},
{id:'r1',cat:'রুটিন',ic:'🗓️',t:'পরীক্ষার রুটিন ছক',d:'তারিখ-বার-বিষয়-সময়ের ছক',
 f:[['inst','প্রতিষ্ঠানের নাম'],['exam','পরীক্ষার নাম'],['rows','সারি (ফরম্যাট: তারিখ | বার | বিষয় | সময় — প্রতি লাইনে একটি)',1]],
 h:d=>'<div class="ph"><h2>'+e(d.inst)+'</h2><p>'+e(d.exam)+' — পরীক্ষার রুটিন</p></div><table><tr><th>ক্রম</th><th>তারিখ</th><th>বার</th><th>বিষয়</th><th>সময়</th></tr>'+d.rows.split('\n').filter(x=>x.trim()).map((r,i)=>{const p=r.split('|').map(x=>e(x.trim()));return '<tr><td>'+(i+1)+'</td><td>'+(p[0]||'')+'</td><td>'+(p[1]||'')+'</td><td>'+(p[2]||'')+'</td><td>'+(p[3]||'')+'</td></tr>';}).join('')+'</table>'}
];
const e=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let curCat='প্রশ্নপত্র',cur=null;const data={};
function renderCats(){
 const cats=[...new Set(TPLS.map(t=>t.cat))];
 document.getElementById('cats').innerHTML=cats.map(c=>'<button class="'+(c==curCat?'sel':'')+'" onclick="curCat=\''+c+'\';renderGrid()">'+c+'</button>').join('');
}
function renderGrid(){
 document.getElementById('grid').innerHTML=TPLS.filter(t=>t.cat==curCat).map(t=>'<div class="tcard" onclick="openTpl(\''+t.id+'\')"><div class="ic">'+t.ic+'</div><h3>'+t.t+'</h3><p>'+t.d+'</p></div>').join('');
}
function openTpl(id){
 cur=TPLS.find(t=>t.id==id);
 document.getElementById('wTitle').textContent=cur.t;
 document.getElementById('wForm').innerHTML=cur.f.map(f=>'<label class="f">'+f[1]+(f[2]?'<textarea id="f_'+f[0]+'" oninput="renderPaper()">'+(data[f[0]]||'')+'</textarea>':'<input id="f_'+f[0]+'" value="'+(data[f[0]]||'')+'" oninput="renderPaper()">')+'</label>').join('');
 document.getElementById('work').classList.add('on');
 renderPaper();
 document.getElementById('work').scrollIntoView({behavior:'smooth'});
}
function renderPaper(){
 if(!cur)return;const d={};cur.f.forEach(f=>{d[f[0]]=document.getElementById('f_'+f[0]).value;data[f[0]]=d[f[0]];});
 document.getElementById('paper').innerHTML=cur.h(d);
}
renderCats();renderGrid();
</script>
</body>
</html>
