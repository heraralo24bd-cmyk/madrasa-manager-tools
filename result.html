<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>রেজাল্ট শিট — Madrasa Manager</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hind Siliguri","Noto Sans Bengali",sans-serif;background:#f1f5f9;color:#0d213d}
.bar{background:#0d213d;color:#fff;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bar a{color:#fff;text-decoration:none;font-size:15px}
.bar h1{font-size:18px;flex:1}
.bar button{background:#c9a227;border:none;color:#0d213d;font-weight:700;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:15px}
.panel{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin:16px auto;max-width:1100px}
.panel h3{margin-bottom:10px;font-size:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
label.f{display:flex;flex-direction:column;font-size:14px;gap:4px}
input,select{padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px;font-family:inherit}
.btn{background:#0d213d;color:#fff;border:none;border-radius:8px;padding:9px 18px;cursor:pointer;font-size:15px;font-family:inherit}
.btn.ghost{background:#fff;color:#0d213d;border:1px solid #0d213d}
.btn.sm{padding:5px 10px;font-size:13px}
.mode{display:flex;gap:8px}
.mode button{border:1px solid #0d213d;background:#fff;color:#0d213d;border-radius:20px;padding:8px 20px;cursor:pointer;font-size:15px;font-family:inherit}
.mode button.sel{background:#0d213d;color:#fff}
.sheet{background:#fff;max-width:1100px;margin:0 auto 30px;padding:24px;border:1px solid #e2e8f0}
.sheet h2{text-align:center;font-size:22px;margin-bottom:2px}
.sheet .sub{text-align:center;color:#475569;margin-bottom:14px;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border:1px solid #94a3b8;padding:6px 8px;text-align:center}
th{background:#0d213d;color:#fff}
td input{width:64px;padding:4px;text-align:center;border:1px solid #cbd5e1;border-radius:6px;font-size:14px}
td input.nm{width:150px;text-align:right}
th input{background:#1e3a5f;color:#fff;border:1px solid #3b5a80;border-radius:6px;padding:4px;width:90px;text-align:center;font-size:13px}
th input.fm{width:52px}
.div-mumtaz{color:#0d213d;font-weight:800}.div-jj{color:#166534;font-weight:700}.div-j{color:#1d4ed8;font-weight:700}.div-m{color:#92400e;font-weight:700}.div-f{color:#b91c1c;font-weight:700}
@media print{.bar,.panel,.noprint{display:none!important}body{background:#fff}.sheet{border:none;max-width:none;margin:0}}
</style>
</head>
<body>
<div class="bar"><a href="index.html" target="_top">← সব টুলস</a><h1>📊 রেজাল্ট শিট</h1><button onclick="window.print()">🖨️ প্রিন্ট</button></div>

<div class="panel noprint">
<h3>সেটিং</h3>
<div class="row">
<label class="f">প্রতিষ্ঠানের নাম<input id="inst" placeholder="যেমন: আল ইসলামিয়া মাদরাসা"></label>
<label class="f">পরীক্ষার নাম<input id="exam" placeholder="যেমন: ১ম সাময়িক পরীক্ষা"></label>
<label class="f">শ্রেণি<input id="cls" placeholder="যেমন: ৫ম শ্রেণি"></label>
<div class="mode" style="align-self:end"><button id="mMad" class="sel" onclick="setMode('mad')">মাদরাসা</button><button id="mSch" onclick="setMode('sch')">স্কুল</button></div>
</div>
<div class="row" style="margin-top:12px">
<button class="btn" onclick="addSubject()">+ বিষয়</button>
<button class="btn" onclick="addStudent()">+ ছাত্র</button>
<button class="btn ghost" onclick="fillSample()">নমুনা ডেটা</button>
</div>
</div>

<div class="panel noprint">
<h3>হিসাব কাস্টমাইজ <button class="btn sm ghost" onclick="document.getElementById('cust').style.display=document.getElementById('cust').style.display=='none'?'block':'none'">বদলাও</button></h3>
<div id="cust" style="display:none"><div class="row">
<label class="f">মুমতাজ %<input type="number" id="cMum" value="80" oninput="render()"></label>
<label class="f">জায়্যিদ জিদ্দান %<input type="number" id="cJj" value="65" oninput="render()"></label>
<label class="f">জায়্যিদ %<input type="number" id="cJ" value="50" oninput="render()"></label>
<label class="f">মাকবুল % (পাস)<input type="number" id="cM" value="33" oninput="render()"></label>
<label class="f">মেধা তালিকা<select id="cMerit" onchange="render()"><option value="0">সবাই</option><option value="3">শীর্ষ ৩</option><option value="5">শীর্ষ ৫</option><option value="10">শীর্ষ ১০</option></select></label>
</div></div>
</div>
<div class="sheet" id="sheet">
<h2 id="shInst">প্রতিষ্ঠানের নাম</h2>
<div class="sub"><span id="shExam">পরীক্ষা</span> — <span id="shCls">শ্রেণি</span> — ফলাফল শিট</div>
<table id="tbl"><thead><tr id="hrow"></tr></thead><tbody id="bdy"></tbody></table>
</div>

<script>
let mode='mad';
let subjects=[{name:'বাংলা',full:100},{name:'অংক',full:100},{name:'ইংরেজি',full:100}];
let students=[{name:'',marks:[{},{},{}]}];
const bn=d=>String(d).replace(/[0-9]/g,c=>'০১২৩৪৫৬৭৮৯'[c]);
function setMode(m){mode=m;document.getElementById('mMad').className=m=='mad'?'sel':'';document.getElementById('mSch').className=m=='sch'?'sel':'';render();}
function addSubject(){subjects.push({name:'',full:100});students.forEach(s=>s.marks.push({}));render();}
function addStudent(){students.push({name:'',marks:subjects.map(()=>({}))});render();}
function delSubject(i){if(subjects.length<=1)return;subjects.splice(i,1);students.forEach(s=>s.marks.splice(i,1));render();}
function delStudent(i){if(students.length<=1)return;students.splice(i,1);render();}
function fillSample(){
 subjects=[{name:'বাংলা',full:100},{name:'আরবি',full:100},{name:'অংক',full:100}];
 students=[{name:'রহিম উদ্দিন',marks:[{},{},{}]},{name:'করিম মিয়া',marks:[{},{},{}]},{name:'সালাম হোসেন',marks:[{},{},{}]}];
 render();
}
function gp(p){if(p>=80)return[5,'A+'];if(p>=70)return[4,'A'];if(p>=60)return[3.5,'A-'];if(p>=50)return[3,'B'];if(p>=40)return[2,'C'];if(p>=33)return[1,'D'];return[0,'F'];}
function th(){return {mum:+document.getElementById('cMum').value||80,jj:+document.getElementById('cJj').value||65,j:+document.getElementById('cJ').value||50,m:+document.getElementById('cM').value||33};}
function divM(p){const t=th();if(p>=t.mum)return['মুমতাজ','div-mumtaz'];if(p>=t.jj)return['জায়্যিদ জিদ্দান','div-jj'];if(p>=t.j)return['জায়্যিদ','div-j'];if(p>=t.m)return['মাকবুল','div-m'];return['অকৃতকার্য','div-f'];}
function render(){
 document.getElementById('shInst').textContent=document.getElementById('inst').value||'প্রতিষ্ঠানের নাম';
 document.getElementById('shExam').textContent=document.getElementById('exam').value||'পরীক্ষা';
 document.getElementById('shCls').textContent=document.getElementById('cls').value||'শ্রেণি';
 const hr=document.getElementById('hrow');
 hr.innerHTML='<th>ক্রম</th><th>নাম</th>'+subjects.map((s,i)=>'<th><input value="'+s.name.replace(/"/g,'&quot;')+'" onchange="subjects['+i+'].name=this.value;render()" placeholder="বিষয়"><br><input class="fm" type="number" value="'+s.full+'" onchange="subjects['+i+'].full=+this.value||100;render()"> <button class="btn sm noprint" onclick="delSubject('+i+')">✕</button></th>').join('')+(mode=='mad'?'<th>মোট</th><th>গড় %</th><th>ডিভিশন</th><th>মেধা</th>':'<th>মোট</th><th>GPA</th><th>গ্রেড</th><th>মেধা</th>');
 const bd=document.getElementById('bdy');bd.innerHTML='';
 const rows=students.map((st,i)=>{
  let tot=0,full=0,fail=false,gpSum=0;
  const passM=th().m;subjects.forEach((s,j)=>{const m=+((st.marks[j]||{}).v)||0;tot+=m;full+=s.full;const p=s.full?m/s.full*100:0;if(p<passM)fail=true;gpSum+=gp(p)[0];});
  const pct=full?tot/full*100:0;
  return {i,tot,pct,fail,gpa:gpSum/subjects.length};
 });
 const order=[...rows].sort((a,b)=>b.tot-a.tot);const rank={};order.forEach((r,k)=>rank[r.i]=k+1);
 const mLim=+document.getElementById('cMerit').value||0;
 rows.forEach(r=>{
  if(mLim&&rank[r.i]>mLim)return;
  const st=students[r.i];const tr=document.createElement('tr');
  let h='<td>'+bn(r.i+1)+'</td><td><input class="nm" value="'+st.name.replace(/"/g,'&quot;')+'" onchange="students['+r.i+'].name=this.value" placeholder="নাম"> <button class="btn sm noprint" onclick="delStudent('+r.i+')">✕</button></td>';
  subjects.forEach((s,j)=>{h+='<td><input type="number" min="0" value="'+(((st.marks[j]||{}).v)??'')+'" onchange="students['+r.i+'].marks['+j+'].v=this.value;render()"></td>';});
  if(mode=='mad'){const d=r.fail?['অকৃতকার্য','div-f']:divM(r.pct);h+='<td><b>'+bn(r.tot)+'</b></td><td>'+bn(r.pct.toFixed(1))+'%</td><td class="'+d[1]+'">'+d[0]+'</td><td>'+bn(rank[r.i])+'</td>';}
  else{const gg=r.fail?[0,'F']:gp(r.gpa*20>100?100:r.pct);const g2=r.fail?'F':(r.gpa>=5?'A+':r.gpa>=4?'A':r.gpa>=3.5?'A-':r.gpa>=3?'B':r.gpa>=2?'C':r.gpa>=1?'D':'F');h+='<td><b>'+bn(r.tot)+'</b></td><td>'+r.gpa.toFixed(2)+'</td><td><b>'+g2+'</b></td><td>'+bn(rank[r.i])+'</td>';}
  tr.innerHTML=h;bd.appendChild(tr);
 });
}
render();
</script>
</body>
</html>
