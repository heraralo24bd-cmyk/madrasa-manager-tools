<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>রুটিন মেকার — Madrasa Manager</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hind Siliguri","Noto Sans Bengali",sans-serif;background:#f1f5f9;color:#0d213d}
.bar{background:#0d213d;color:#fff;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bar a{color:#fff;text-decoration:none;font-size:15px}
.bar h1{font-size:18px;flex:1}
.bar button{background:#c9a227;border:none;color:#0d213d;font-weight:700;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:15px}
.tabs{display:flex;gap:8px;justify-content:center;margin:16px}
.tabs button{border:1px solid #0d213d;background:#fff;color:#0d213d;border-radius:20px;padding:8px 24px;cursor:pointer;font-size:15px;font-family:inherit}
.tabs button.sel{background:#0d213d;color:#fff}
.panel{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin:0 auto 16px;max-width:1100px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
label.f{display:flex;flex-direction:column;font-size:14px;gap:4px}
input{padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px;font-family:inherit}
.btn{background:#0d213d;color:#fff;border:none;border-radius:8px;padding:9px 18px;cursor:pointer;font-size:15px;font-family:inherit}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.ghost{background:#fff;color:#0d213d;border:1px solid #0d213d}
.sheet{background:#fff;max-width:1100px;margin:0 auto 30px;padding:24px;border:1px solid #e2e8f0;overflow-x:auto}
.sheet h2{text-align:center;font-size:22px}
.sheet .sub{text-align:center;color:#475569;margin:4px 0 14px;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:700px}
th,td{border:1px solid #94a3b8;padding:6px;text-align:center}
th{background:#0d213d;color:#fff}
td input{width:100%;border:none;text-align:center;font-size:14px;padding:6px}
td input:focus{outline:2px solid #0d213d}
.sig{display:flex;justify-content:space-between;margin-top:50px;font-size:15px}
@media print{.bar,.tabs,.panel{display:none!important}body{background:#fff}.sheet{border:none;max-width:none;margin:0}}
</style>
</head>
<body>
<div class="bar"><a href="index.html" target="_top">← সব টুলস</a><h1>🗓️ রুটিন মেকার</h1><button onclick="window.print()">🖨️ প্রিন্ট</button></div>
<div class="tabs noprint"><button id="tC" class="sel" onclick="show('c')">ক্লাস রুটিন</button><button id="tE" onclick="show('e')">পরীক্ষার রুটিন</button></div>

<div id="pC">
<div class="panel noprint"><div class="row">
<label class="f">প্রতিষ্ঠানের নাম<input id="cInst" oninput="renderC()" placeholder="মাদরাসার নাম"></label>
<label class="f">শ্রেণি<input id="cCls" oninput="renderC()" placeholder="যেমন: ৫ম শ্রেণি"></label>
<button class="btn" onclick="addPeriod()">+ পিরিয়ড</button>
</div></div>
<div class="sheet"><h2 id="cHInst">প্রতিষ্ঠানের নাম</h2><div class="sub">ক্লাস রুটিন — <span id="cHCl">শ্রেণি</span></div>
<table id="cTbl"></table>
<div class="sig"><span>শ্রেণি শিক্ষকের স্বাক্ষর</span><span>মুহতামিমের স্বাক্ষর</span></div>
</div>
</div>

<div id="pE" style="display:none">
<div class="panel noprint"><div class="row">
<label class="f">প্রতিষ্ঠানের নাম<input id="eInst" oninput="renderE()" placeholder="মাদরাসার নাম"></label>
<label class="f">পরীক্ষার নাম<input id="eExam" oninput="renderE()" placeholder="যেমন: ১ম সাময়িক"></label>
<button class="btn" onclick="addERow()">+ সারি</button>
</div></div>
<div class="sheet"><h2 id="eHInst">প্রতিষ্ঠানের নাম</h2><div class="sub">পরীক্ষার রুটিন — <span id="eHEx">পরীক্ষা</span></div>
<table><thead><tr><th>ক্রম</th><th>তারিখ</th><th>বার</th><th>বিষয়</th><th>সময়</th><th>কক্ষ</th><th class="noprint"></th></tr></thead><tbody id="eBdy"></tbody></table>
<div class="sig"><span>পরীক্ষা নিয়ন্ত্রকের স্বাক্ষর</span><span>মুহতামিমের স্বাক্ষর</span></div>
</div>
</div>

<script>
const DAYS=['শনিবার','রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার'];
const bn=d=>String(d).replace(/[0-9]/g,c=>'০১২৩৪৫৬৭৮৯'[c]);
let periods=[{t:'৯:০০ – ৯:৪৫'},{t:'৯:৪৫ – ১০:৩০'},{t:'১০:৪৫ – ১১:৩০'},{t:'১১:৩০ – ১২:১৫'}];
let cells={};
let erows=[{d:'',day:'',sub:'',t:'',r:''},{d:'',day:'',sub:'',t:'',r:''},{d:'',day:'',sub:'',t:'',r:''}];
function show(w){document.getElementById('pC').style.display=w=='c'?'block':'none';document.getElementById('pE').style.display=w=='e'?'block':'none';document.getElementById('tC').className=w=='c'?'sel':'';document.getElementById('tE').className=w=='e'?'sel':'';}
function addPeriod(){periods.push({t:''});renderC();}
function renderC(){
 document.getElementById('cHInst').textContent=document.getElementById('cInst').value||'প্রতিষ্ঠানের নাম';
 document.getElementById('cHCl').textContent=document.getElementById('cCls').value||'শ্রেণি';
 const t=document.getElementById('cTbl');
 let h='<thead><tr><th>সময়</th>'+DAYS.map(d=>'<th>'+d+'</th>').join('')+'<th class="noprint"></th></tr></thead><tbody>';
 periods.forEach((p,pi)=>{
  h+='<tr><td><input value="'+p.t.replace(/"/g,'&quot;')+'" onchange="periods['+pi+'].t=this.value" placeholder="৯:০০ – ৯:৪৫" style="font-weight:700"></td>';
  DAYS.forEach((d,di)=>{const k=pi+':'+di;h+='<td><input value="'+((cells[k]||'').replace(/"/g,'&quot;'))+'" onchange="cells[\''+k+'\']=this.value" placeholder="বিষয় / শিক্ষক"></td>';});
  h+='<td class="noprint"><button class="btn sm" onclick="periods.splice('+pi+',1);renderC()">✕</button></td></tr>';
 });
 t.innerHTML=h+'</tbody>';
}
function addERow(){erows.push({d:'',day:'',sub:'',t:'',r:''});renderE();}
function renderE(){
 document.getElementById('eHInst').textContent=document.getElementById('eInst').value||'প্রতিষ্ঠানের নাম';
 document.getElementById('eHEx').textContent=document.getElementById('eExam').value||'পরীক্ষা';
 const b=document.getElementById('eBdy');b.innerHTML='';
 erows.forEach((r,i)=>{
  const tr=document.createElement('tr');
  tr.innerHTML='<td>'+bn(i+1)+'</td>'+
  ['d','day','sub','t','r'].map(k=>'<td><input value="'+(r[k]||'').replace(/"/g,'&quot;')+'" onchange="erows['+i+'].'+k+'=this.value"></td>').join('')+
  '<td class="noprint"><button class="btn sm" onclick="erows.splice('+i+',1);renderE()">✕</button></td>';
  b.appendChild(tr);
 });
}
renderC();renderE();
</script>
</body>
</html>
